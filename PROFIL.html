<div id="blokProfilToko" class="d-none">
  <!-- Detail Informasi Profil -->
  <div class="matrix-section">
    <div class="section-title">
      <div class="section-title-text"><span class="section-dot" style="background:#0284c7;"></span> DETAIL PROFIL TOKO</div>
    </div>
    
    <div class="profile-card-container">
      <div class="profile-photo-box">
        <img id="imgProfilToko" src="" alt="Foto Toko" onerror="this.src='https://placehold.co/600x400?text=Foto+Toko+Tidak+Ditemukan'">
      </div>
      <div class="profile-info-box">
        <table class="profile-table">
          <tr>
            <th>Nama Toko</th>
            <td id="tdNamaToko">-</td>
          </tr>
          <tr>
            <th>Tanggal Opening</th>
            <td id="tdTglOpening">-</td>
          </tr>
          <tr>
            <th>Alamat</th>
            <td id="tdAlamat">-</td>
          </tr>
          <tr>
            <th>Koordinat GPS</th>
            <td id="tdKoordinat">-</td>
          </tr>
          <tr>
            <td colspan="3" class="pt-2">
              <button type="button" id="btnGoogleReview" class="btn btn-warning btn-sm w-100 fw-bold shadow-sm" onclick="bukaGoogleReview()">
                <i class="bi bi-star-fill me-1"></i> Buka Google Review
              </button>
            </td>
          </tr>
        </table>
      </div>
    </div>
  </div>

  <!-- Struktur Organisasi Dinamis -->
  <div class="matrix-section" style="margin-top: 25px;">
    <div class="section-title">
      <div class="section-title-text"><span class="section-dot" style="background:#10b981;"></span> STRUKTUR ORGANISASI TOKO</div>
    </div>
    
    <div class="org-chart-wrapper">
      <!-- Tingkat 1: Store Supervisor -->
      <div class="org-level">
        <div id="tier-supervisor" class="org-group single-center"></div>
      </div>
      <div class="org-line"></div>
      <!-- Tingkat 2: Store Assistant Supervisor -->
      <div class="org-level">
        <div id="tier-assistant" class="org-group row-flex"></div>
      </div>
      <div class="org-line"></div>
      <!-- Tingkat 3: Cashier -->
      <div class="org-level">
        <div id="tier-cashier" class="org-group row-flex"></div>
      </div>
    </div>
  </div>
</div>
